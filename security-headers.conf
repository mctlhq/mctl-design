# Included at server level and again in every location that sets its own
# add_header: nginx drops all inherited add_header directives from a block
# that declares any, so a location with a Cache-Control would otherwise
# serve none of these. `always` keeps them on 404s too.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Storybook renders stories in a same-origin iframe; nothing else may frame it.
add_header X-Frame-Options "SAMEORIGIN" always;
