server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # All three floating sheets, not only mctl.css. global.css and prose.css
    # used to match nothing here and fell through to the generic asset regex
    # below: 7 days and no CORS header, while the README documents the three as
    # one set that moves with main.
    location ~ ^/(mctl|global|prose)\.css$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Version-pinned copies of the three published sheets, written by
    # packages/css/scripts/build-css.mjs. /mctl.css floats with main — it is
    # one URL with no version in it, so a token change reaches every product
    # within the hour with nothing to roll back to, which is why consumers
    # ended up hand-copying the palette instead (#75, seerrsense#16).
    #
    # Immutable is a promise, and this deploys on every merge rather than on a
    # tag, so nothing about the pipeline keeps it. scripts/check-token-version-bump.mjs
    # does: a change under packages/{tokens,css}/{src,scripts} fails CI
    # unless the version moves too, so a given X.Y.Z is only ever built from
    # one set of sources — and a directory already on main cannot be edited,
    # moved or deleted at all, and the root version must be X.Y.Z with an
    # optional -prerelease, since this regex serves no other shape. Placed above the generic asset regex, which would
    # otherwise claim it at 7d with no CORS header.
    # The prerelease suffix is matched deliberately: build-css.mjs writes
    # whatever package.json says, so a 0.6.0-rc.1 directory would otherwise be
    # claimed by the generic asset regex below and served for 7 days with no
    # CORS header — working, quietly, with the wrong headers.
    location ~ ^/[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/(mctl|global|prose)\.css$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Brand kit (hex, favicons, sidebar wordmarks). ^~ wins over the
    # hashed-asset regex so consumers can fetch /brand/*.svg (CORS) and
    # pick up updates in 1h. Root *.svg stay at 7d — do not put brand
    # marks there (#28 recolored /mctl-logo-*.svg in place; CF kept cyan).
    location ^~ /brand/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Leftover root brand aliases. 1h so the next in-place edit is not
    # stuck behind the 7d svg regex the way /favicon.svg still is.
    location ~* ^/(favicon|mctl-logo-.*|mctl-hex)\.svg$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
