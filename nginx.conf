server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /mctl.css {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Brand kit (hex, favicons, sidebar wordmarks). ^~ wins over the
    # hashed-asset regex so consumers can fetch /brand/*.svg (CORS) and
    # pick up updates in 1h. Root *.svg stay at 7d — do not put brand
    # marks there (#28 recolored /mctl-logo-*.svg in place; CF kept cyan).
    location ^~ /brand/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Leftover root brand aliases. 1h so the next in-place edit is not
    # stuck behind the 7d svg regex the way /favicon.svg still is.
    location ~* ^/(favicon|mctl-logo-.*|mctl-hex)\.svg$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|json)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
