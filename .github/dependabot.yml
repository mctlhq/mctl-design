version: 2
updates:
  # `directory: /` is enough: dependabot resolves the pnpm workspace from
  # pnpm-workspace.yaml and updates every member manifest in one pull request.
  # Listing the members as well produced an exact duplicate of each update --
  # #56 and #63 both bumped @vitejs/plugin-vue in packages/ui, from the same
  # version to the same version.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
    # The repo targets Node 22 LTS (.nvmrc, CI, the image). Its types move
    # with that line, not with the newest Node: a major here is a deliberate
    # runtime change made together with .nvmrc, ci.yml, the Dockerfile and
    # the @types/node entry in pnpm-workspace.yaml's catalog.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    # Same Node 22 LTS line as above. Odd majors (25, 27) never become LTS,
    # and the next LTS is adopted on purpose, not by a weekly bump.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
