name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run on its previous head, so cancel that
# one. Runs on main are never cancelled: deploy.yml fires on each completed
# CI run there, and a cancelled one would skip that commit's deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check:token-version diffs against origin/main, and a branch that
          # started more than a shallow fetch behind it has no merge base
          # locally. Guessing a depth is what makes that failure quiet.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gates at `low`: nothing is knowingly open. The last low advisory
      # (esbuild GHSA-g7r4-m6w7-qqqr, through tsup 8) closed with tsup 9. If one
      # has to stay open, lower the gate to one level above it and write the
      # reason down, rather than ignore it. See CONTRIBUTING.md -> Dependency
      # overrides.
      #
      # Placed right after the install because that is all it needs, and
      # because it is the one step here that can go red with no change to
      # the tree: a newly published advisory fails every pull request and
      # every push to main until it is answered. Cheap to learn early. Since
      # deploy.yml waits for this workflow, a red audit on main also holds
      # the ui.mctl.ai deploy until it is answered.
      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        # .prettierignore lists what is generated or version-gated.
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # Component contracts (v-model, keyboard, form behaviour) and an axe
        # pass over the rendered DOM. jsdom has no layout, so colour contrast
        # is not part of this step. @mctlhq/ui also enforces a per-file v8
        # coverage floor on src/ (see packages/ui/vitest.config.ts).
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Check colour contrast
        # Every text/background pair the components render, per theme and
        # accent, against WCAG AA. Reads the built tokens, so it follows the
        # build. A token comment claiming "AA on paper" is not a check.
        # The selftest pins the tint composite, the ratio maths and the
        # KNOWN ratchet, so the gate does not depend on the data it checks.
        run: |
          pnpm check:contrast:selftest
          pnpm check:contrast

      - name: Check nested theme scopes
        # data-theme and data-accent nest at any depth in any combination;
        # resolves the cascade over the built theme.css (no browser in CI).
        # The selftest proves the resolver still fails the 0.8.0 pairing.
        run: |
          pnpm check:themes:selftest
          pnpm check:themes

      - name: Check generated token exports
        # tailwind.css (Tailwind v4 theme) and tokens.dtcg.json are built by
        # string assembly; nothing else reads them before a consumer does.
        run: pnpm check:generated

      - name: Check components use tokens
        # Borders, focus rings, opacities, durations and z-index in component
        # styles come from tokens, so a token change and reduced motion reach
        # them; MTg* keep literal var() fallbacks on purpose and are exempt.
        # Also fails a var() with no fallback whose name nothing defines, and
        # an MTg font fallback that differs from the display token; reads the
        # built packages/css/dist and packages/tokens/dist, so it runs after
        # the build.
        run: |
          pnpm check:component-tokens:selftest
          pnpm check:component-tokens

      - name: Check lockstep versions
        run: pnpm check:versions

      - name: Check license reference
        run: pnpm check:license

      - name: Check token changes carry a version bump
        # ui.mctl.ai serves /<version>/mctl.css immutable for a year, and it
        # deploys on every green merge to main rather than on a tag — so this
        # check is the only thing making that promise true.
        #
        # Ordered ahead of the cleanliness step on purpose. A failing step ends
        # the job, and on a version rollback the cleanliness step fails too —
        # with "Generated CSS is not committed", whose obvious remedy is the
        # commit that poisons the published URL. This one names the actual
        # problem, so it has to be the message the author sees.
        run: |
          node scripts/check-token-version-bump.mjs --selftest
          BASE_REF=origin/main pnpm check:token-version

      - name: Check the generated CSS is committed
        # apps/storybook/public/*.css are tracked, and the versioned copies
        # under it are what keep old pins alive — a build only ever writes the
        # version it is building. A forgotten `git add` would pass every other
        # check here and still 404 that pinned URL one release later, when the
        # image stops containing the directory. Runs after the build above, so
        # a dirty tree means the committed copies do not match the sources.
        #
        # `git status --porcelain`, not `git diff --exit-code`: diff compares
        # the index against the working tree, and a brand-new version directory
        # is in neither, so it exits 0 on exactly the forgotten `git add` this
        # exists to catch. `git add -u` is the realistic route in — it stages
        # the rewritten tracked sheets and leaves the new directory behind.
        run: |
          DIRTY=$(git status --porcelain -- apps/storybook/public)
          if [ -n "$DIRTY" ]; then
            echo "Generated CSS is not committed:"
            echo "$DIRTY"
            exit 1
          fi
