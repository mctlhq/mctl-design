name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check:token-version diffs against origin/main, and a branch that
          # started more than a shallow fetch behind it has no merge base
          # locally. Guessing a depth is what makes that failure quiet.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gates at `moderate`, not `low`. One low advisory is knowingly open --
      # esbuild GHSA-g7r4-m6w7-qqqr, which `pnpm audit` reports on four paths,
      # every one of them through tsup, which pins `esbuild@^0.27.0` in its
      # latest release; closing it would mean forcing 0.28 across a range tsup
      # does not declare. A gate that has to be bypassed on its first run
      # teaches the bypass, so it sits one level above what is actually open.
      # See CONTRIBUTING.md -> Dependency overrides for the full condition.
      #
      # Placed right after the install because that is all it needs, and
      # because it is the one step here that can go red with no change to
      # the tree: a newly published advisory fails every pull request and
      # every push to main until it is answered. Cheap to learn early.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Check lockstep versions
        run: pnpm check:versions

      - name: Check the generated CSS is committed
        # apps/storybook/public/*.css are tracked, and the versioned copies
        # under it are what keep old pins alive — a build only ever writes the
        # version it is building. A forgotten `git add` would pass every other
        # check here and still 404 that pinned URL one release later, when the
        # image stops containing the directory. Runs after the build above, so
        # a dirty tree means the committed copies do not match the sources.
        run: git diff --exit-code -- apps/storybook/public

      - name: Check token changes carry a version bump
        # ui.mctl.ai serves /<version>/mctl.css immutable for a year, and it
        # deploys on every merge to main rather than on a tag — so this check
        # is the only thing making that promise true.
        run: BASE_REF=origin/main pnpm check:token-version
