name: Deploy to ui.mctl.ai

# Continuous deploy of the Storybook UI: every merge to main builds an image
# tagged with the commit SHA and rolls it out via the centralized mctl-gitops
# pipeline. Deliberately NOT gated on a semver tag / release-please — a UI
# change must reach ui.mctl.ai as soon as it lands on main, with no hidden
# "no release was cut" stall. publish.yml (npm packages on a semver tag) is a
# separate release track and is unaffected.
#
# Gated on CI. It used to fire on the push itself, in parallel with ci.yml,
# so a main that failed the token-version or generated-CSS checks still
# shipped -- and /<version>/ is served immutable for a year, so a bad sheet
# there cannot be taken back by the next commit. workflow_run starts this
# only when CI finished on a push to main, and the job below runs only when
# that run succeeded. It deploys the commit CI checked (head_sha), not
# whatever main points at by now.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize deploys: overlapping main merges must not fire competing
# release-deploy dispatches, since the gitops image.tag bump is a
# single-writer commit to mctl-gitops main.
concurrency:
  group: deploy-mctl-design
  cancel-in-progress: false

permissions:
  contents: read
  # gh run list, to find main's newest green CI run.
  actions: read

jobs:
  deploy:
    # The only job that mints; the key is released here and nowhere else.
    environment: app-dispatch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Uses mctl-gitops-dispatch, a dedicated App with only actions:write +
      # metadata:read, installed on mctl-gitops alone. Its private key lives
      # ONLY in the main-only environment app-dispatch (mctlhq/mctl-gitops#1033),
      # so a branch other than main cannot mint a token. Deliberately NOT
      # MCTL App (APP_CLIENT_ID), the customer-installed App narrowed to
      # contents:read + metadata:read (mctlhq/mctl-gitops#761), and no longer
      # the broad mctl-agents App (AGENTS_APP_*), which stays for bot mints.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      # workflow_run fires when CI *finishes*, so two quick merges can finish
      # out of order and the older commit would deploy last. Deploy only if
      # this is main's newest green CI run: an older commit that finishes
      # after a newer green one is skipped, but a green commit followed by a
      # red one still deploys, so a red merge cannot strand a published
      # /<version>/ path behind it.
      - name: Skip unless this is main's newest green CI run
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          NEWEST=$(gh run list --repo "${{ github.repository }}" --workflow CI \
            --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')
          # This run itself is a green run on main, so an empty list is an
          # API or workflow-name problem, not a newer commit. Fail loudly
          # rather than skip and leave ui.mctl.ai silently behind main.
          if [ -z "$NEWEST" ]; then
            echo "::error::could not determine main's newest green CI run"
            exit 1
          fi
          if [ "$NEWEST" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::newest green run on main is $NEWEST; it deploys instead of $SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch centralized release-deploy (SHA-tagged image)
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="${SHA:0:12}"
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-design \
            -f git_ref="$SHA" \
            -f image_name=ghcr.io/mctlhq/mctl-design \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-design
