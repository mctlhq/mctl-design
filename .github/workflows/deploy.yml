name: Deploy to ui.mctl.ai

# Continuous deploy of the Storybook UI: every merge to main builds an image
# tagged with the commit SHA and rolls it out via the centralized mctl-gitops
# pipeline. Deliberately NOT gated on a semver tag / release-please — a UI
# change must reach ui.mctl.ai as soon as it lands on main, with no hidden
# "no release was cut" stall. publish.yml (npm packages on a semver tag) is a
# separate release track and is unaffected.
#
# Gated on CI. It used to fire on the push itself, in parallel with ci.yml,
# so a main that failed the token-version or generated-CSS checks still
# shipped -- and /<version>/ is served immutable for a year, so a bad sheet
# there cannot be taken back by the next commit. workflow_run starts this
# only when CI finished on a push to main, and the job below runs only when
# that run succeeded. It deploys the commit CI checked (head_sha), not
# whatever main points at by now.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize deploys: overlapping main merges must not fire competing
# release-deploy dispatches, since the gitops image.tag bump is a
# single-writer commit to mctl-gitops main.
concurrency:
  group: deploy-mctl-design
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Uses mctl-agents, the backend-only automation App — deliberately
      # NOT MCTL App (secrets.APP_ID). MCTL App is the App customers install
      # themselves from mctl.ai/#request-access, and it is being narrowed to
      # contents:read + metadata:read so its published least-privilege
      # description is actually true (mctlhq/mctl-gitops#761). A GitHub App's
      # permissions apply to every installation alike, so anything needing
      # write — like actions:write on mctl-gitops to dispatch below — has to
      # live on the internal App instead.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      # workflow_run fires when CI *finishes*, so two quick merges can finish
      # out of order and the older commit would deploy last. Deploy only
      # while this commit is still main's tip; a newer commit's own run
      # covers it otherwise (and holds the deploy if that run is red).
      - name: Skip if main has moved past this commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$TIP" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $TIP; the run for that commit deploys instead of $SHA"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch centralized release-deploy (SHA-tagged image)
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="${SHA:0:12}"
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-design \
            -f git_ref="$SHA" \
            -f image_name=ghcr.io/mctlhq/mctl-design \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-design
