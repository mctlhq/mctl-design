name: Publish

# Publishes @mctlhq/* packages to GitHub Packages. Triggered only by a semver
# tag with no `v` prefix (e.g. 0.1.0, or 0.9.0-rc.1 for a prerelease). The tag
# must match every package version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify the tag is on main
        # A tag pushed from an unmerged branch would publish code that never
        # passed ci.yml or review.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches package versions
        run: pnpm check:versions
        env:
          GIT_TAG: ${{ github.ref_name }}

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Check colour contrast
        run: pnpm check:contrast

      - name: Check generated token exports
        run: pnpm check:generated

      - name: Publish to GitHub Packages
        # A prerelease goes out under the `next` dist-tag, so `latest` (what a
        # bare install resolves) only ever moves to a stable version.
        run: |
          case "$TAG" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          pnpm --filter "./packages/*" publish --no-git-checks --tag "$DIST_TAG"
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  move-next:
    # A stable release moves `next` too; otherwise it stays on the last
    # prerelease and @next resolves older than @latest. Its own job, so a
    # failure here can be re-run alone: re-running the publish job would try
    # to publish the same version again and be refused.
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v5+ caches automatically when package.json names a
          # packageManager (pnpm here), but this job never installs pnpm, so
          # the cache step would fail looking for its store.
          package-manager-cache: false

      - name: Point next at this release
        run: |
          for pkg in packages/*/package.json; do
            name=$(jq -r 'select(.private != true) | .name' "$pkg")
            [ -n "$name" ] || continue
            npm dist-tag add "$name@$TAG" next
          done
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
