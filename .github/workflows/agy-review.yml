name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  agy-review:
    # Pinned to a commit like claude-review.yml, not @main: this job holds
    # pull-requests: write, and a moving ref would let any push to the org
    # repo change what runs here. Dependabot (github-actions) bumps the pin.
    uses: mctlhq/.github/.github/workflows/agy-review.yml@4fc2fce3215172965b042b7ad082aa45cb7ebd63
    permissions:
      contents: read
      pull-requests: write
    with:
      conventions: |
        Focus on: Vue 3 SFC component correctness and TypeScript prop/emits signatures, web accessibility (a11y) and keyboard navigation, CSS variable & token design system consistency, monorepo exports and lockstep versioning parity (`pnpm check:versions`), Storybook story coverage, breaking prop/slot changes in published components, and TypeScript compilation errors.
