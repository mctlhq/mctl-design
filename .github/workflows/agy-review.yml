name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      conventions: |
        Focus on: Vue 3 SFC component correctness and TypeScript prop/emits signatures, web accessibility (a11y) and keyboard navigation, CSS variable & token design system consistency, monorepo exports and lockstep versioning parity (`pnpm check:versions`), Storybook story coverage, breaking prop/slot changes in published components, and TypeScript compilation errors.
