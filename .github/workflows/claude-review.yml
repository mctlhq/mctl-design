name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@0ca555be1bfadf79f76f2fd56a00e91b89806ffe
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot"
      conventions: |
        Follow the conventions in this repository's CLAUDE.md (conventional
        commits, English only, no emoji, M-prefixed components).

        Focus on:
        - Design tokens: values must match the MCTL design spec; no
          hard-coded colors/sizes that bypass @mctlhq/tokens.
        - Cross-package contracts: package exports, peerDependencies,
          lockstep versioning (all package versions must match;
          `pnpm check:versions`).
        - Vue 3 SFC components: prop/emits typing, accessibility and
          keyboard navigation, scoped styles, no leaking global CSS.
        - Storybook story coverage and breaking prop/slot changes in
          published components.
        - Build correctness: tsup/Vite/Storybook config, CI scripts.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
