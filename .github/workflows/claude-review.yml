name: Claude PR review

# Thin caller of the org reusable reviewer. The local copy this replaces had
# drifted: its action pins, gate hardening and model IDs were maintained by
# hand, and its complexity classifier was still the one copied from
# mctl-telegram (see #37) rather than anything to do with this repository.
#
# The tiering that #37 restored is preserved here as inputs — the reusable
# workflow has carried sensitive-paths / code-paths / test-paths and the three
# model tiers all along.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@83de7592939117e7ce9bbeb524dd71b3a9eb23a4
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # mctl-agents is the App the DevLoop implementer runs under; without the
      # slug claude-code-action hard-fails with "Workflow initiated by
      # non-human actor" and, since main requires an approving review, such a
      # PR is structurally unmergeable (#36).
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents"

      # Tier 3 — a bad change here leaves this repository or changes how the
      # site is served: packages/tokens and packages/css are published as
      # @mctlhq/tokens and @mctlhq/css and consumed by mctl-web, mctl-docs and
      # mctl-portal; every package.json at any depth is a published manifest
      # (@mctlhq/ui carries an exports map consumers resolve against) or the
      # manifest the site is built from; nginx.conf caching produced the
      # stale-favicon series (#28-#33); Dockerfile, workflows and scripts
      # decide what gets built at all. Dockerfile and nginx.conf exist only at
      # the root today but are matched at any depth so a future per-app copy
      # is not silently demoted (agy P2 on #37).
      sensitive-paths: '^((.*/)?(Dockerfile|nginx\.conf|package\.json)$|packages/(tokens|css)/|scripts/|\.github/workflows/|pnpm-workspace\.yaml$)'

      # Tier 2 — the UI package and the Storybook config. Overrides the
      # extension-based default because in this repository the meaningful
      # split is by package, not by suffix: a .ts file under
      # apps/storybook/stories is a story, not library code.
      code-paths: '^(packages/ui/|apps/storybook/\.storybook/)'
      test-paths: '\.stories\.ts$'

      conventions: |
        Follow the conventions in this repository's CLAUDE.md (conventional
        commits, English only, no emoji, M-prefixed components).

        Focus on:
        - Design tokens: values must match the MCTL design spec; no
          hard-coded colors/sizes that bypass @mctlhq/tokens.
        - Cross-package contracts: package exports, peerDependencies,
          lockstep versioning (all package versions must match;
          `pnpm check:versions`).
        - Vue 3 SFC components: prop/emits typing, accessibility and
          keyboard navigation, scoped styles, no leaking global CSS.
        - Storybook story coverage and breaking prop/slot changes in
          published components.
        - Build correctness: Vite/Storybook config, nginx caching headers,
          CI scripts.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
