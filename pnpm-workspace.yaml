packages:
  - 'packages/*'
  - 'apps/*'

# Single source of truth for the build and test toolchain shared by
# packages/ui and apps/storybook. Both consumed the same ranges and had to be
# edited in lockstep by hand; a catalog makes the next major a one-line change.
# The vitest packages move together: a partial bump would put two vitest
# majors in one lockfile.
catalog:
  vite: ^8.3.5
  '@vitejs/plugin-vue': ^6.0.10
  vitest: ^5.0.5
  '@vitest/browser': ^5.0.5
  '@vitest/browser-playwright': ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@types/node': ^22.20.5
